          type: string
    ResetRequest:
      type: object
      properties:
        email:
          type: string
    ResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
    PairRequest:
      type: object
      properties:
        code:
          type: string
        deviceName:
          type: string
        platform:
          type: string
    DeleteAccountRequest:
