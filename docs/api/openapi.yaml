          type: string
          format: uuid
    SnapshotDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        label:
          type: string
        automatic:
          type: boolean
        wordCount:
          type: integer
          format: int32
        content:
          $ref: "#/components/schemas/JsonNode"
        createdAt:
          type: string
          format: date-time
    ChangeRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        op:
          type: string
        deviceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/JsonNode"
    PullResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRecord"
        latestId:
          type: integer
          format: int64
          description: Highest change id actually served in this response — never
            the feed's true maximum. A client that advanced past unserved rows would
            skip them permanently.
        hasMore:
          type: boolean
          description: More rows exist past this page; pull again from latestId.
        resyncRequired:
          type: boolean
          description: "The client's cursor points into history the server can no\
            \ longer explain (purged by retention, or the project was restored from\
            \ an older backup). `changes` is empty; the client must rebuild from GET\
            \ /binder plus documents and resume at latestId."
