# Tests run against a REAL Postgres in an isolated schema, never H2. The tx_id /
# pg_snapshot_xmin visibility gate and the concurrent-commit ordering case depend on
# genuine MVCC semantics and cannot be reproduced in-memory.
#
# Schema isolation is used instead of a throwaway database because the `noveltea`
# role owns the database but lacks CREATEDB. Override the URL for CI/Testcontainers.
spring:
  datasource:
    url: ${NOVELTEA_TEST_JDBC_URL:jdbc:postgresql://localhost:5432/noveltea?currentSchema=noveltea_test,public}
    username: ${NOVELTEA_TEST_DB_USER:noveltea}
    password: ${NOVELTEA_TEST_DB_PASSWORD:noveltea}
  liquibase:
    default-schema: noveltea_test
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
  threads:
    virtual:
      enabled: true
logging:
  level:
    liquibase: WARN

noveltea:
  auth:
    # Test-only key. Never used outside the test profile.
    jwt-secret: dGVzdC1vbmx5LXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24tMzJiKw==
    access-token-ttl: 15m
    refresh-token-ttl: 60d
    pairing-code-ttl: 10m

  limits:
    sync-page-size: 200
    max-sync-page-size: 500
    max-push-batch-size: 500
    max-title-length: 500
    max-name-length: 200
    max-document-bytes: 8388608

  compile:
    storage-path: ${java.io.tmpdir:/tmp}/noveltea-test-exports
    staging-path: ${java.io.tmpdir:/tmp}/noveltea-test-staging
    download-ttl: 1h

  snapshots:
    # Automatic captures are pruned to this many per document. Manual snapshots are never
    # pruned: the author asked for those.
    keep-automatic-per-document: 25

  rate-limit:
    enabled: false
  cors:
    allowed-origins: []

  retention:
    # The scheduler is off in tests; the sweep is driven directly.
    enabled: false
    change-log-retention: 90d
    tombstone-retention: 180d
    artifact-grace: 1d
    expired-credential-retention: 30d

  account:
    deletion-grace: 14d
    password-reset-ttl: 1h
