spring:
  application:
    name: noveltea-api

  # JDK 21. Both hot paths — sync requests and compile-job dispatch — are
  # I/O-bound waiting on Postgres or the worker, which is what virtual threads
  # are for. Requires Boot 3.2+.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/noveltea}
    username: ${DB_USERNAME:noveltea}
    password: ${DB_PASSWORD:noveltea}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Liquibase owns the schema. Hibernate must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}

noveltea:
  auth:
    # No default on purpose: a fallback signing key is a fallback that reaches
    # production. Startup fails if this is unset or shorter than 32 bytes.
    #   export NOVELTEA_JWT_SECRET=$(openssl rand -base64 48)
    jwt-secret: ${NOVELTEA_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 60d
    pairing-code-ttl: 10m
