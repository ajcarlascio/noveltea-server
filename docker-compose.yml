# Local development database only. Not a deployment artifact.
services:
  postgres:
    image: postgres:16-alpine
    container_name: noveltea-postgres
    environment:
      POSTGRES_DB: noveltea
      POSTGRES_USER: noveltea
      POSTGRES_PASSWORD: noveltea
    ports:
      - "5432:5432"
    volumes:
      - noveltea-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noveltea -d noveltea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noveltea-pgdata:
