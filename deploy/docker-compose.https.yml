# Opt-in TLS. Browsers give a page OPFS (where the client keeps your writing) and service
# workers only in a secure context: https, or http://localhost. Served over plain http to
# another machine, the app runs in memory and loses everything when the tab closes.
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# Set NOVELTEA_HOSTNAME in .env. A public DNS name pointing here, with 80 and 443 reachable
# from the internet, gets a Let's Encrypt certificate with nothing more. A LAN-only name or
# IP cannot: set NOVELTEA_TLS=internal and Caddy signs with its own CA, whose root every
# browser must then be told to trust (README, "HTTPS").
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      NOVELTEA_HOSTNAME: ${NOVELTEA_HOSTNAME:?set NOVELTEA_HOSTNAME in .env}
      NOVELTEA_TLS: ${NOVELTEA_TLS:-}
    ports:
      - "${NOVELTEA_HTTP_PORT:-80}:80"
      - "${NOVELTEA_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates, and with `internal` the CA itself. Lose data/ and every browser
      # that trusted the old root has to be told again.
      - caddy_data:/data
      - caddy_config:/config

  web:
    # `ports` appends across files rather than replacing, so the base file's mapping has
    # to be reset or the web container stays published in clear next to Caddy.
    ports: !reset []
    environment:
      # Lets the web container's nginx believe Caddy's X-Forwarded-For, so the login rate
      # limit counts real client addresses instead of Caddy's.
      NOVELTEA_TRUSTED_PROXY: 172.28.77.0/24

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.77.0/24

volumes:
  caddy_data:
  caddy_config:
