# Version catalogue. Plugin versions are pinned here; library versions are left to
# the Spring Boot BOM wherever it manages them, so they move as a coherent set.
[versions]
springBoot = "3.5.0"
springDependencyManagement = "1.1.7"
liquibaseGradle = "2.2.2"
picocli = "4.7.6"
testcontainers = "1.20.4"
# Apache-2.0. Runtime OpenAPI/Swagger UI generation and the build-time plugin that
# writes the spec to a file — both from the same project, kept in step deliberately.
springdocOpenapi = "2.8.6"
springdocOpenapiGradlePlugin = "1.9.0"

[libraries]
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
liquibase = { id = "org.liquibase.gradle", version.ref = "liquibaseGradle" }
springdocOpenapiGradle = { id = "org.springdoc.openapi-gradle-plugin", version.ref = "springdocOpenapiGradlePlugin" }
